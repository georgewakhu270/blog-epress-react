
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Header Marker Editor</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --text:#1c2430; --muted:#6b7686;
  --border:#d5dae2; --accent:#2457d6; --accent-text:#ffffff; --marker:#b45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14171c; --surface:#1d2128; --text:#e8ebf0; --muted:#98a2b3;
    --border:#333a45; --accent:#6c93f5; --accent-text:#0d1117; --marker:#f0a64a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14171c; --surface:#1d2128; --text:#e8ebf0; --muted:#98a2b3;
  --border:#333a45; --accent:#6c93f5; --accent-text:#0d1117; --marker:#f0a64a;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1.title{font-size:1.4rem;margin:0 0 .25rem}
p.sub{margin:0 0 1rem;color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:.5rem;margin-bottom:.75rem}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.45rem .85rem;border-radius:6px}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.6rem}
.toolbar .label{color:var(--muted);font-size:.9rem;margin-right:.25rem}
textarea{width:100%;min-height:55vh;padding:.9rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.hint{color:var(--muted);font-size:.85rem;margin-top:.5rem}
.hint code{color:var(--marker)}
.status{color:var(--muted);font-size:.85rem;margin-top:.25rem}
#display{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem}
#display h1,#display h2,#display h3{line-height:1.25;margin:1.4rem 0 .5rem}
#display h1{font-size:1.75rem}
#display h2{font-size:1.4rem}
#display h3{font-size:1.15rem}
#display p{margin:.5rem 0}
#display .empty{color:var(--muted)}
nav.toc{border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;background:var(--bg)}
nav.toc strong{display:block;margin-bottom:.35rem;font-size:.9rem;color:var(--muted)}
nav.toc button{display:block;border:0;background:none;padding:.15rem 0;color:var(--accent);text-align:left}
nav.toc button:hover{text-decoration:underline}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1 class="title">Header Marker Editor</h1>
  <p class="sub">Type your content and mark headers as you go. Switch to Display to see them rendered.</p>
 
  <div class="tabs" role="tablist">
    <button id="tab-write" class="active" role="tab" aria-selected="true">Write</button>
    <button id="tab-display" role="tab" aria-selected="false">Display</button>
  </div>
 
  <section id="write">
    <div class="toolbar">
      <span class="label">Mark current line as:</span>
      <button data-level="1">Header 1</button>
      <button data-level="2">Header 2</button>
      <button data-level="3">Header 3</button>
      <button data-level="0">Plain text</button>
    </div>
    <textarea id="editor" aria-label="Content" placeholder="Start typing…&#10;&#10;Select a line and press a Header button, or use Ctrl+1, Ctrl+2, Ctrl+3."></textarea>
    <div class="hint">Markers are plain text at the start of a line: <code>#</code> = Header 1, <code>##</code> = Header 2, <code>###</code> = Header 3. You can also type them by hand.</div>
    <div class="status" id="status"></div>
  </section>
 
  <section id="display-wrap" class="hidden">
    <nav class="toc" id="toc"></nav>
    <article id="display"></article>
  </section>
</main>
 
<script>
(function(){
  var editor = document.getElementById('editor');
  var statusEl = document.getElementById('status');
  var KEY = 'header-marker-editor:text';
 
  // Restore saved text (storage can be empty or blocked)
  try { var saved = localStorage.getItem(KEY); if (saved) editor.value = saved; } catch(e){}
 
  function save(){
    try { localStorage.setItem(KEY, editor.value); } catch(e){}
    var count = parse(editor.value).filter(function(b){return b.type==='h';}).length;
    statusEl.textContent = count + (count === 1 ? ' header marked' : ' headers marked') + ' · saved in this browser';
  }
 
  // Apply a header marker (level 1-3, or 0 to clear) to every line in the selection
  function setHeader(level){
    var v = editor.value;
    var s = editor.selectionStart, e = editor.selectionEnd;
    var lineStart = v.lastIndexOf('\n', s - 1) + 1;
    var nl = v.indexOf('\n', e);
    var lineEnd = nl === -1 ? v.length : nl;
    var block = v.slice(lineStart, lineEnd).split('\n').map(function(line){
      var clean = line.replace(/^#{1,6}\s*/, '');
      if (level === 0 || clean === '') return clean;
      return new Array(level + 1).join('#') + ' ' + clean;
    }).join('\n');
    editor.value = v.slice(0, lineStart) + block + v.slice(lineEnd);
    editor.focus();
    editor.setSelectionRange(lineStart, lineStart + block.length);
    save();
  }
 
  // Turn text into blocks: headers and paragraphs
  function parse(text){
    var blocks = [], para = [];
    function flush(){ if (para.length){ blocks.push({type:'p', text: para.join(' ')}); para = []; } }
    text.split('\n').forEach(function(line){
      var m = line.match(/^(#{1,3})\s+(.+)$/);
      if (m){ flush(); blocks.push({type:'h', level: m[1].length, text: m[2].trim()}); }
      else if (line.trim() === ''){ flush(); }
      else { para.push(line.trim()); }
    });
    flush();
    return blocks;
  }
 
  // Render using textContent so typed text is never treated as HTML
  function render(){
    var blocks = parse(editor.value);
    var out = document.getElementById('display');
    var toc = document.getElementById('toc');
    out.innerHTML = ''; toc.innerHTML = '';
    if (!blocks.length){
      var p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'Nothing to display yet. Write something first.';
      out.appendChild(p); toc.classList.add('hidden'); return;
    }
    var heads = [];
    blocks.forEach(function(b){
      var el = document.createElement(b.type === 'h' ? 'h' + b.level : 'p');
      el.textContent = b.text;
      out.appendChild(el);
      if (b.type === 'h') heads.push({level: b.level, text: b.text, el: el});
    });
    if (!heads.length){ toc.classList.add('hidden'); return; }
    toc.classList.remove('hidden');
    var title = document.createElement('strong'); title.textContent = 'Contents'; toc.appendChild(title);
    heads.forEach(function(h){
      var b = document.createElement('button');
      b.textContent = h.text;
      b.style.paddingLeft = ((h.level - 1) * 1.1) + 'rem';
      b.addEventListener('click', function(){ h.el.scrollIntoView({behavior:'smooth', block:'start'}); });
      toc.appendChild(b);
    });
  }
 
  function show(which){
    var w = which === 'write';
    document.getElementById('write').classList.toggle('hidden', !w);
    document.getElementById('display-wrap').classList.toggle('hidden', w);
    var tw = document.getElementById('tab-write'), td = document.getElementById('tab-display');
    tw.classList.toggle('active', w); td.classList.toggle('active', !w);
    tw.setAttribute('aria-selected', w); td.setAttribute('aria-selected', !w);
    if (!w) render();
  }
 
  document.getElementById('tab-write').addEventListener('click', function(){ show('write'); });
  document.getElementById('tab-display').addEventListener('click', function(){ show('display'); });
  document.querySelectorAll('.toolbar button').forEach(function(btn){
    btn.addEventListener('click', function(){ setHeader(Number(btn.dataset.level)); });
  });
  editor.addEventListener('input', save);
  editor.addEventListener('keydown', function(ev){
    if ((ev.ctrlKey || ev.metaKey) && ['1','2','3'].indexOf(ev.key) !== -1){
      ev.preventDefault(); setHeader(Number(ev.key));
    }
  });
  save();
})();
</script>
</body>
</html>
