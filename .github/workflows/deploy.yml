name: Blog Application

on:
  push:
    branches: [main]

  workflow_dispatch:    

permissions: 
  contents: read
  pages: write
  id-token: write
  
concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-latest
  deploy:
    runs-on: ubuntu-latest
    needs: build

    
